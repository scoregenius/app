    <!-- No webfont is loaded. Four requests to Google Fonts used to sit here,
         fetching Inter, which no CSS rule in the project ever referenced: the
         Tailwind sans stack is Source Sans 3 and the mono stack leads with
         Consolas. So the third-party request §5.2 forbids was being made on
         every app load, for a face nothing used, while the specified face was
         absent — document.fonts measured empty and body text resolved to the
         system UI sans. Defect 72; decision 4 stands at (b), mono only.
         Adding a webfont again means self-hosting it, not restoring these. -->
